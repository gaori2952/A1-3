<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ProjectFlow | 로그인</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><main class="auth-layout"><section class="auth-intro"><a class="brand" href="login.html"><span class="brand-mark">PF</span><span>ProjectFlow</span></a><div class="auth-message"><p class="eyebrow">개인 프로젝트 관리</p><h1>흩어진 아이디어를<br>눈에 보이는 진척으로.</h1><p>작업을 기록하고, 위험 요소를 발견하고, AI와 함께 다음에 중요한 일을 선택하세요.</p></div><div class="signal-list"><span>01 / 목표를 세우고</span><span>02 / 집중해서 만들고</span><span>03 / 자신 있게 마무리하기</span></div></section><section class="auth-panel"><div class="auth-card"><p class="eyebrow" id="auth-eyebrow">다시 오신 것을 환영합니다</p><h2 id="auth-title">워크스페이스에 로그인</h2><p class="muted" id="auth-description">프로젝트가 기다리고 있습니다.</p><form id="auth-form"><label>이메일<input type="email" name="email" required placeholder="you@example.com"></label><label>비밀번호<input type="password" name="password" required minlength="6" placeholder="6자 이상 입력하세요"></label><p class="form-error" id="auth-error"></p><button class="button button-primary button-wide" type="submit" id="auth-submit">로그인</button></form><button class="switch-auth" id="switch-auth" type="button">처음이신가요? 계정 만들기</button><button class="demo-link" id="demo-login" type="button">데모 워크스페이스로 미리보기</button></div></section></main><script type="module" src="js/auth.js"></script></body></html>
