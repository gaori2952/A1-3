<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ProjectFlow | 프로젝트</title><link rel="stylesheet" href="css/style.css?v=3"><link rel="stylesheet" href="css/project-delete.css?v=1"><link rel="stylesheet" href="css/design.css?v=1"></head>
<body data-page="project"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">PF</span><span>ProjectFlow</span></a><nav class="top-actions"><a class="text-link" href="archive.html">보관함</a><button class="button button-ghost" data-logout>로그아웃</button></nav></header><main class="shell project-shell"><a class="back-link" href="index.html">← 전체 프로젝트</a><section id="project-header" class="project-header reveal"></section><div class="project-columns"><section class="content-column"><section id="next-actions" class="next-actions-panel"></section><div class="section-heading"><div><p class="eyebrow">해야 할 일</p><h2>작업</h2></div><button class="button button-small button-dark" id="add-task">＋ 작업 추가</button></div><form id="quick-add-form" class="quick-add scheduled-add"><label class="task-name-field">작업 이름<input name="title" required maxlength="120" placeholder="할 일을 입력하세요"></label><div class="schedule-fields"><label>날짜<input type="date" name="date"></label><label>시작 시간<input type="time" name="time"></label><label>소요 시간 (분)<input type="number" name="duration" value="60" min="15" max="480" step="15" required></label><label>마감일<input type="date" name="deadline"></label></div><p id="add-task-error" class="form-error" role="alert"></p><button class="button button-primary" type="submit">작업 추가</button></form><div id="task-list" class="task-list"></div><div class="section-heading issue-heading"><div><p class="eyebrow">문제 기록</p><h2>이슈</h2></div><button class="button button-small button-dark" id="add-issue">＋ 이슈 추가</button></div><div id="issue-list" class="issue-list"></div></section><aside class="insight-callout"><p class="eyebrow">AI 인사이트</p><h2>다음에는 무엇을 해야 할까요?</h2><p>현재 프로젝트 상황을 바탕으로 이번 주에 실행할 계획을 받아보세요.</p><a class="button button-primary button-wide" id="analyze-link" href="#">프로젝트 분석 <span>→</span></a></aside></div></main><dialog id="item-modal" class="modal"><form method="dialog" id="item-form"><button class="modal-close" value="cancel" aria-label="닫기">×</button><p class="eyebrow">이슈 추가</p><h2>이슈 추가하기</h2><label>이슈 내용<input name="content" maxlength="180" placeholder="진행을 막고 있는 문제는 무엇인가요?"></label><label>심각도<select name="severity"><option value="low">낮음</option><option value="medium" selected>보통</option><option value="high">높음</option></select></label><div class="form-actions"><button class="button button-ghost" value="cancel">취소</button><button class="button button-primary" value="default">추가</button></div></form></dialog><script type="module" src="js/project.js?v=5"></script></body></html>
