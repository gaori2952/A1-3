<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ProjectFlow | Projects</title><link rel="stylesheet" href="css/style.css?v=3"><link rel="stylesheet" href="css/project-delete.css?v=1"><link rel="stylesheet" href="css/design.css?v=7"></head>
<body data-page="project"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">PF</span><span>ProjectFlow</span></a><nav class="top-actions"><a class="text-link" href="archive.html">Archive</a><button class="button button-ghost" data-logout>Sign out</button></nav></header><main class="shell project-shell"><a class="back-link" href="index.html">← All projects</a><section id="project-header" class="project-header reveal"></section><div class="project-columns"><section class="content-column"><section id="next-actions" class="next-actions-panel"></section><div class="section-heading"><div><p class="eyebrow">Tasks</p><h2>Tasks</h2></div><button class="button button-small button-dark" id="add-task">＋ Add task</button></div><form id="quick-add-form" class="quick-add scheduled-add"><label class="task-name-field">Task name<input name="title" required maxlength="120" placeholder="Enter a task"></label><div class="schedule-fields"><label>Date<input type="date" name="date"></label><label>Start time<input type="time" name="time"></label><label>Duration (min)<input type="number" name="duration" value="60" min="15" max="480" step="15" required></label><label>Deadline<input type="date" name="deadline"></label></div><p id="add-task-error" class="form-error" role="alert"></p><button class="button button-primary" type="submit">Add task</button></form><div id="task-list" class="task-list"></div><div class="section-heading issue-heading"><div><p class="eyebrow">ISSUES</p><h2>Issues</h2></div><button class="button button-small button-dark" id="add-issue">＋ Add issue</button></div><div id="issue-list" class="issue-list"></div></section><aside class="insight-callout"><p class="eyebrow">AI insights</p><h2>Project insights</h2><p>Review progress and plan your next steps.</p><a class="button button-primary button-wide" id="analyze-link" href="#">Analyze project <span>→</span></a></aside></div></main><dialog id="item-modal" class="modal"><form method="dialog" id="item-form"><button class="modal-close" value="cancel" aria-label="Close">×</button><p class="eyebrow">Add issue</p><h2>Add issue</h2><label>Issue<input name="content" maxlength="180" placeholder="What is blocking progress?"></label><label>Severity<select name="severity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><div class="form-actions"><button class="button button-ghost" value="cancel">Cancel</button><button class="button button-primary" value="default">Add</button></div></form></dialog><script type="module" src="js/project.js?v=11"></script></body></html>
