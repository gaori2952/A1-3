<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectFlow | 설정</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/settings.css?v=2">
</head>
<body data-page="settings">
  <header class="topbar">
    <nav class="top-actions">
      <a class="text-link" href="index.html">대시보드</a>
      <button class="button button-ghost" data-logout>로그아웃</button>
    </nav>
  </header>
  <main class="shell settings-shell">
    <section class="page-heading reveal">
      <div>
        <p class="eyebrow">WORKSPACE SETTINGS</p>
        <h1>나에게 맞는 분류를 만드세요.</h1>
        <p class="lede">프로젝트 유형을 추가하거나 이름과 색상을 바꾸면 일정에서 바로 구분할 수 있습니다.</p>
      </div>
    </section>

    <section class="settings-section reveal delay-1">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PROJECT TOPICS</p>
          <h2>프로젝트 유형</h2>
        </div>
        <button class="button button-primary" id="add-type">＋ 유형 추가</button>
      </div>
      <div id="type-list" class="type-list"></div>
    </section>

    <section class="settings-section canvas-section reveal delay-2" aria-labelledby="canvas-heading">
      <div class="section-heading canvas-heading">
        <div>
          <p class="eyebrow">CALENDAR INTEGRATION</p>
          <h2 id="canvas-heading">Canvas LMS</h2>
          <p class="canvas-description">성균관대학교 Canvas에서 현재 수강 중인 과제 일정을 가져옵니다.</p>
        </div>
        <button class="button button-primary" id="canvas-sync" type="button">Canvas 일정 가져오기</button>
      </div>
      <p id="canvas-status" class="canvas-status" role="status" aria-live="polite">Canvas 일정은 확인 후 선택할 수 있으며 자동으로 저장되지 않습니다.</p>
      <div id="canvas-preview" class="canvas-preview hidden" aria-live="polite"></div>
    </section>

    <dialog id="type-modal" class="modal">
      <form method="dialog" id="type-form">
        <button class="modal-close" value="cancel" aria-label="닫기">×</button>
        <p class="eyebrow">PROJECT TOPIC</p>
        <h2 id="type-title">유형 추가</h2>
        <label>이름<input name="label" required maxlength="24" placeholder="예: 운동"></label>
        <label>색상<input name="color" type="color" value="#2457c5"></label>
        <div class="form-actions">
          <button class="button button-ghost" value="cancel">취소</button>
          <button class="button button-primary" value="default">저장</button>
        </div>
      </form>
    </dialog>
  </main>
  <script type="module" src="js/settings.js?v=2"></script>
</body>
</html>
